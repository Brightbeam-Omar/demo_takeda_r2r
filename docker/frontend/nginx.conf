# Static app plus the same two proxies as the Vite dev server. The upstream names are variables so nginx starts
# even when the agents service does not exist yet (F12); a call to it then returns 502.
server {
  listen 8080;
  resolver 127.0.0.11 valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    set $api http://app-api:8000;
    proxy_pass $api;
    proxy_set_header Host $host;
  }

  location /agents-api/ {
    set $agents http://agents:8200;
    rewrite ^/agents-api/(.*)$ /$1 break;
    proxy_pass $agents;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
