[project]
name = "r2r-core"
version = "0.1.0"
description = "Shared core: site profile, demo clock, domain enums, SLA maths"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2r_core"]
