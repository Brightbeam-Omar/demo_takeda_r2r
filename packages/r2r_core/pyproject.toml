[project]
name = "r2r-core"
version = "0.1.0"
description = "Shared core: site profile, demo clock, domain enums, SLA maths"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "tzdata",
    "sqlalchemy>=2,<2.1",  # 2.1 breaks the stack tests (F20 CI); see services/pipeline
    "alembic>=1.13",
    "fastapi>=0.110",
]

[project.optional-dependencies]
# The Delta contract reader (the sync worker installs it; other services do not need it).
delta = ["deltalake>=0.18", "pyarrow>=16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2r_core"]
