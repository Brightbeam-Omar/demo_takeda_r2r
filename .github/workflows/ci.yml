name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make check

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: r2r
          POSTGRES_PASSWORD: r2r_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r2r"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: r2r_dev_only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # Service containers cannot mount the init directory, so run the same init script by hand.
      - name: Create R2R databases
        run: psql -h localhost -U r2r -d postgres -f docker/postgres/init/01-create-dbs.sql
      - name: Integration tests
        run: uv run pytest tests/integration -m integration

  docker-build:
    name: docker build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/python.Dockerfile
          platforms: linux/amd64
          push: false
