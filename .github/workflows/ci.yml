name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    env:
      CI: "true"
      # The denylist content (newline-separated terms). A missing secret fails the leak scan by design.
      LEAKSCAN_DENYLIST: ${{ secrets.LEAKSCAN_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make check
      - name: Leak scan commit messages and authors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="origin/main..${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          uv run python -m leakscan --commits "$RANGE"

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: r2r
          POSTGRES_PASSWORD: r2r_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U r2r"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: r2r_dev_only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # Service containers cannot mount the init directory, so run the same init script by hand.
      - name: Create R2R databases
        run: psql -h localhost -U r2r -d postgres -f docker/postgres/init/01-create-dbs.sql
      - name: Integration tests
        run: uv run pytest -m integration

  docker-build:
    name: docker build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/python.Dockerfile
          platforms: linux/amd64
          push: false

  # Builds every image and starts the compose stack, then runs the acceptance tests against it.
  # Pull requests only, to keep push feedback fast.
  stack:
    name: stack acceptance (docker compose)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: make stack-test
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
