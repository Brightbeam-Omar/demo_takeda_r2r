[project]
name = "agents"
version = "0.1.0"
description = "Agent harness (F12): model gateway, read-only tools, validator, proposals, the air-gap agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "r2r-core",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "sqlalchemy>=2,<2.1",  # 2.1 breaks the stack tests (F20 CI); see services/pipeline
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]
