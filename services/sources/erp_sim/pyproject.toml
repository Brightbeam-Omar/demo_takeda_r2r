[project]
name = "erp-sim"
version = "0.1.0"
description = "ERP simulator: SAP-shaped tables, read API and scenario event endpoints"
requires-python = ">=3.12,<3.13"
dependencies = [
    "r2r-core",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_sim"]
