[project]
name = "scenario"
version = "0.1.0"
description = "Scenario service: owns the demo clock (set and advance), triggers the pipeline, runs scenario steps and the demo reset"
requires-python = ">=3.12,<3.13"
dependencies = [
    "r2r-core",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "sqlalchemy>=2,<2.1",  # 2.1 breaks the stack tests (F20 CI); see services/pipeline
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scenario"]

[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "scenario/scenarios"
