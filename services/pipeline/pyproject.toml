[project]
name = "r2r-pipeline"
version = "0.1.0"
description = "Data product pipeline: extract, stage engine, snapshot, metrics, publish and notify (DuckDB over Delta, Dagster)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "r2r-core",
    "duckdb>=1.0",
    "deltalake>=0.18",
    "pyarrow>=16",
    "jinja2>=3.1",
    "sqlglot>=25",
    "sqlalchemy>=2,<2.1",  # Dagster's Postgres storage fails on SQLAlchemy 2.1 ("connection is closed")
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dagster-postgres>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2r_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "r2r_pipeline/sql"
