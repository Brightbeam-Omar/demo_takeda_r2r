[project]
name = "app-api"
version = "0.1.0"
description = "Application: skeleton owning the app database migrations (F04: demo_clock); API and sync arrive in F08-F09"
requires-python = ">=3.12,<3.13"
dependencies = [
    "r2r-core",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_api"]
