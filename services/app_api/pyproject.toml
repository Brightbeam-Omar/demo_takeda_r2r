[project]
name = "app-api"
version = "0.1.0"
description = "Application: app database, sync layer (F08: webhook, queue, drain worker, mirror) and API (F09)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "r2r-core",
    "deltalake>=0.18",  # the drain worker reads the Delta lakehouse (F08)
    "pyarrow>=16",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2,<2.1",  # 2.1 breaks the stack tests (F20 CI); see services/pipeline
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",  # Demo Controls forward to the scenario service (F13)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_api"]
