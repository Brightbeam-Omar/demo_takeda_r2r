# R2R Intelligence Demo: local stack. Variables are read from .env (`cp .env.example .env`).
# Host ports can be overridden (POSTGRES_HOST_PORT, SCENARIO_HOST_PORT, ERP_HOST_PORT, LIMS_HOST_PORT,
# QMS_HOST_PORT, DAGSTER_HOST_PORT, APP_API_HOST_PORT, FRONTEND_HOST_PORT, FRONTEND_WEB_HOST_PORT, LAKEHOUSE_HOST_DIR): `make stack-test` uses other ports and its own project so the demo stack is never touched.
# Later features add services (agents).

# Bind mount for the Delta lakehouse. Dagster mounts it read-write (`*lakehouse`); the app-worker, the only
# application reader, mounts the same directory read-only (`*lakehouse-ro`, F08-FR-06).
x-lakehouse: &lakehouse ${LAKEHOUSE_HOST_DIR:-./lakehouse}:/lakehouse
x-lakehouse-ro: &lakehouse-ro ${LAKEHOUSE_HOST_DIR:-./lakehouse}:/lakehouse:ro

# One image recipe for every Python service; SERVICE_PATH picks the workspace member to install.
x-python-service: &python-service
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: migrates the `app` database (F04: demo_clock; F08 adds more). Others wait for it.
  db-migrate:
    <<: *python-service
    restart: "no"
    image: r2r-app-api
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: {SERVICE_PATH: services/app_api}
    command: ["python", "-m", "app_api.migrate"]
    depends_on:
      postgres: {condition: service_healthy}

  # Owns the demo clock. Reads and writes it straight from the database (never over HTTP: that would be itself).
  scenario:
    <<: *python-service
    image: r2r-scenario
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: {SERVICE_PATH: services/sources/scenario}
    command: ["uvicorn", "scenario.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      CLOCK_SOURCE: db
    ports:
      - "${SCENARIO_HOST_PORT:-8100}:8100"
    depends_on:
      postgres: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The simulators migrate their own database, then start. Clock: scenario service over HTTP, DB as fallback.
  erp-sim:
    <<: *python-service
    image: r2r-erp-sim
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: {SERVICE_PATH: services/sources/erp_sim}
    command: ["sh", "-c", "python -m erp_sim.migrate && exec uvicorn erp_sim.app:app --host 0.0.0.0 --port 8101"]
    environment:
      CLOCK_SOURCE: http
    ports:
      - "${ERP_HOST_PORT:-8101}:8101"
    depends_on:
      postgres: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      scenario: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  lims-sim:
    <<: *python-service
    image: r2r-lims-sim
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: {SERVICE_PATH: services/sources/lims_sim}
    command: ["sh", "-c", "python -m lims_sim.migrate && exec uvicorn lims_sim.app:app --host 0.0.0.0 --port 8102"]
    environment:
      CLOCK_SOURCE: http
    ports:
      - "${LIMS_HOST_PORT:-8102}:8102"
    depends_on:
      postgres: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      scenario: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  qms-sim:
    <<: *python-service
    image: r2r-qms-sim
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: {SERVICE_PATH: services/sources/qms_sim}
    command: ["sh", "-c", "python -m qms_sim.migrate && exec uvicorn qms_sim.app:app --host 0.0.0.0 --port 8103"]
    environment:
      CLOCK_SOURCE: http
    ports:
      - "${QMS_HOST_PORT:-8103}:8103"
    depends_on:
      postgres: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      scenario: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8103/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The application API (F08: webhook and sync status; F09 adds the rest). It never mounts the lakehouse.
  app-api:
    <<: *python-service
    image: r2r-app-api
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: {SERVICE_PATH: services/app_api}
    command: ["uvicorn", "app_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CLOCK_SOURCE: http
    ports:
      - "${APP_API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      scenario: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The React app (F10). `frontend` is the Vite dev server (hot reload needs a rebuild here, `make up` does it).
  # `frontend-web` is the production nginx image on 8080 and starts only with `--profile prod`.
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    environment:
      API_PROXY_TARGET: http://app-api:8000
      AGENTS_PROXY_TARGET: http://agents:8200
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      app-api: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend-web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: prod
    ports:
      - "${FRONTEND_WEB_HOST_PORT:-8080}:8080"
    depends_on:
      app-api: {condition: service_healthy}
    restart: unless-stopped

  # The drain worker (F08): the only application code that reads the lakehouse, which it mounts read-only.
  app-worker:
    <<: *python-service
    image: r2r-app-api
    command: ["python", "-m", "app_api.worker"]
    environment:
      CLOCK_SOURCE: http
      LAKEHOUSE_PATH: /lakehouse
    volumes:
      - *lakehouse-ro
    depends_on:
      postgres: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      scenario: {condition: service_healthy}

  # The data product (F07). One image for both Dagster processes; the lakehouse is mounted read-write here only.
  # The pipeline reads the demo clock over HTTP from `scenario` (database fallback), like the simulators.
  dagster-web:
    <<: *python-service
    image: r2r-pipeline
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: {SERVICE_PATH: services/pipeline}
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3001", "-w", "/app/services/pipeline/dagster_home/workspace.yaml"]
    environment: &dagster-environment
      DAGSTER_HOME: /app/services/pipeline/dagster_home
      CLOCK_SOURCE: http
      LAKEHOUSE_PATH: /lakehouse
    volumes:
      - *lakehouse
    ports:
      - "${DAGSTER_HOST_PORT:-3001}:3001"
    depends_on:
      postgres: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
      scenario: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/server_info', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Runs schedules (the 4-hourly one is defined but stopped). Starts after the web server has set up the instance.
  dagster-daemon:
    <<: *python-service
    image: r2r-pipeline
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args: {SERVICE_PATH: services/pipeline}
    command: ["dagster-daemon", "run", "-w", "/app/services/pipeline/dagster_home/workspace.yaml"]
    environment: *dagster-environment
    volumes:
      - *lakehouse
    depends_on:
      dagster-web: {condition: service_healthy}

volumes:
  pgdata:
