[project]
name = "r2r-demo"
version = "0.1.0"
description = "R2R Intelligence Demo workspace root"
requires-python = ">=3.12,<3.13"
dependencies = ["r2r-core"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

# Explicit members: each is added when its package exists (F01 decision OQ-002).
[tool.uv.workspace]
members = ["packages/r2r_core"]

[tool.uv.sources]
r2r-core = { workspace = true }
