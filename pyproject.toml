[project]
name = "r2r-demo"
version = "0.1.0"
description = "R2R Intelligence Demo workspace root"
requires-python = ">=3.12,<3.13"
dependencies = ["r2r-core", "leakscan"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "psycopg[binary]>=3.2",
    "types-openpyxl",
    "types-pyyaml",
]

[tool.uv]
package = false

# Explicit members: each is added when its package exists (F01 decision OQ-002).
[tool.uv.workspace]
members = ["packages/r2r_core", "tools/leakscan"]

[tool.uv.sources]
r2r-core = { workspace = true }
leakscan = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["frontend", "lakehouse", "artifacts", "specs"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Worked-example tables read better unwrapped.
"**/tests/**" = ["E501"]


[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# pyarrow ships no type stubs (used by tools/leakscan)
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "tools"]
addopts = "-ra --import-mode=importlib -m 'not integration'"
markers = [
    "integration: needs running services such as Postgres (skipped by `make check`, run in the CI integration job)",
]
