[project]
name = "leakscan"
version = "0.1.0"
description = "Client-term leak scanner (constitution P5)"
requires-python = ">=3.12,<3.13"
dependencies = ["openpyxl>=3.1", "pyarrow>=16", "deltalake>=0.18"]

[dependency-groups]
dev = ["types-openpyxl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leakscan"]
